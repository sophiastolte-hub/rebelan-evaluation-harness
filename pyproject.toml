[project]
name = "rebelan-eval"
version = "0.1.0"
description = "Reproducible, leakage-resistant evaluation harness for an AI-led health-insurance appeals workflow (Rebelan.ai trial assignment)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - internal evaluation use only" }
dependencies = [
    "jsonschema>=4.21,<5",
    "click>=8.1,<9",
    "anthropic>=0.40,<1",
    "python-dotenv>=1.0,<2",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "black>=24.0,<25",
]

[project.scripts]
eval = "rebelan_eval.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rebelan_eval = ["**/*.json", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
